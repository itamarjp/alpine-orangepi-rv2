name: Build Alpine Orange Pi RV2 image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/build-image.yml'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -shellcheck "$(command -v shellcheck)"

  self-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install layout-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted gdisk e2fsprogs util-linux python3 cpio shellcheck
      - name: Check extlinux image logic
        run: sudo bash scripts/self-check.sh

  build:
    needs: self-check
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full qemu-user-static binfmt-support xz-utils \
            e2fsprogs util-linux fdisk parted gdisk curl python3 cpio
      - name: Build experimental GPT image
        run: sudo env OUTPUT_DIR="$GITHUB_WORKSPACE/dist" bash scripts/build-image.sh
      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-orangepi-rv2-experimental
          path: |
            dist/*.img.xz
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
