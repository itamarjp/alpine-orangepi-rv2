name: Publish Alpine RV2 image

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: write

concurrency:
  group: publish-alpine-rv2-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full qemu-user-static binfmt-support xz-utils \
            e2fsprogs util-linux fdisk parted gdisk curl python3 cpio shellcheck
      - name: Check extlinux image logic
        run: sudo bash scripts/self-check.sh
      - name: Build experimental GPT image
        run: sudo env OUTPUT_DIR="$GITHUB_WORKSPACE/dist" bash scripts/build-image.sh
      - name: Publish direct xz assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          base="$(date -u +%Y.%m.%d)"
          tag="$base"
          n=2
          while :; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              tag="${base}-${n}"
              n=$((n + 1))
            else
              status=$?
              [ "$status" -eq 2 ] || exit "$status"
              break
            fi
          done
          notes="Experimental Alpine riscv64 image for Orange Pi RV2. Requires manufacturer OpenSBI/U-Boot in SPI; the image does not flash SPI. Wi-Fi/Bluetooth unsupported. SSH root/alpine is enabled: change the default password immediately."
          notes+=$'\nAutomated experimental build; this specific image has not been individually boot-tested on Orange Pi RV2 hardware.'
          notes+=$'\nKernel 6.6.63-ky is GPL-2.0: https://github.com/orangepi-xunlong/linux-orangepi/commit/ae9e974d3e19f460b6397bfe8f0f1417a073ce05 (branch orange-pi-6.6-ky).'
          gh release create "$tag" \
            dist/alpine-orangepi-rv2-riscv64.img.xz dist/SHA256SUMS \
            --title "Orange Pi RV2 Alpine experimental ${tag}" \
            --notes "$notes" \
            --generate-notes \
            --prerelease --target "$GITHUB_SHA"
