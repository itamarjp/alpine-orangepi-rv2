name: Publish Alpine RV2 image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New prerelease tag (e.g. alpine-rv2-test-1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full qemu-user-static binfmt-support xz-utils e2fsprogs util-linux curl
      - name: Apply Alpine 3.24.2 preparation when available
        run: |
          if test -f scripts/prepare-build.py; then python3 scripts/prepare-build.py; fi
      - name: Build image
        run: sudo env OUTPUT_DIR="$GITHUB_WORKSPACE/dist" bash scripts/build-image.sh
      - name: Publish direct xz assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -f dist/alpine-orangepi-rv2-riscv64.img.xz
          test -f dist/SHA256SUMS
          gh release create "$RELEASE_TAG" dist/alpine-orangepi-rv2-riscv64.img.xz dist/SHA256SUMS \
            --title "Orange Pi RV2 Alpine experimental $RELEASE_TAG" \
            --notes "Experimental Alpine riscv64 image. Not yet verified to boot on physical hardware. Default SSH root password must be changed immediately." \
            --prerelease --target "$GITHUB_SHA"
