name: Publish Alpine RV2 image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New prerelease tag (e.g. alpine-rv2-test-1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full qemu-user-static binfmt-support xz-utils \
            e2fsprogs util-linux fdisk parted gdisk curl python3 cpio shellcheck
      - name: Check extlinux image logic
        run: sudo bash scripts/self-check.sh
      - name: Build experimental GPT image
        run: sudo env OUTPUT_DIR="$GITHUB_WORKSPACE/dist" bash scripts/build-image.sh
      - name: Publish direct xz assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -f dist/alpine-orangepi-rv2-riscv64.img.xz
          test -f dist/SHA256SUMS
          gh release create "$RELEASE_TAG" dist/alpine-orangepi-rv2-riscv64.img.xz dist/SHA256SUMS \
            --title "Orange Pi RV2 Alpine experimental $RELEASE_TAG" \
            --notes "Experimental Alpine riscv64 image for Orange Pi RV2. Requires manufacturer OpenSBI/U-Boot in SPI; the image does not flash SPI. Wi-Fi/Bluetooth unsupported. SSH root/alpine is enabled: change the default password immediately." \
            --prerelease --target "$GITHUB_SHA"
