name: Inspect Orange Pi RV2 boot requirements

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full util-linux
      - name: Download verified vendor image
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o vendor.7z https://github.com/itamarjp/alpine-orangepi-rv2/releases/download/kernel-6.6.63-ky/Orangepirv2_1.0.0_ubuntu_noble_server_linux6.6.63.7z
          echo "edc1d18e83e9cb509eb12dbab162555269b8255f64636a33e0ca8fcd33d865af  vendor.7z" | sha256sum -c -
          mkdir -p unpack
          7z x -ounpack vendor.7z
      - name: Read boot settings and modules
        run: |
          set -euo pipefail
          IMG="$(find unpack -name '*.img' -type f -print -quit)"
          test -n "$IMG"
          mkdir -p root
          LOOP="$(sudo losetup --find --show --partscan --read-only "$IMG")"
          trap 'sudo umount root 2>/dev/null || true; sudo losetup -d "$LOOP" || true' EXIT
          sudo mount -o ro "${LOOP}p1" root
          {
            echo '## boot.cmd'
            sudo cat root/boot/boot.cmd || true
            echo '## orangepi boot.cmd'
            sudo cat root/usr/share/orangepi/boot.cmd || true
            echo '## boot tree'
            sudo ls -lah root/boot
            echo '## modules'
            sudo ls -lah root/lib/modules root/usr/lib/modules 2>/dev/null || true
            echo '## kernel version and boot metadata'
            sudo ls -lah root/boot/dtb-6.6.63-ky/ky/ root/usr/lib/firmware/esos.elf 2>/dev/null || true
            echo '## fstab'
            sudo cat root/etc/fstab || true
            echo '## boot environment references'
            sudo grep -R -n -E 'root=|rootdev|fdtfile|initrd|bootargs' root/boot/boot.cmd root/usr/share/orangepi/boot.cmd root/boot/orangepiEnv.txt 2>/dev/null || true
          } | tee boot-requirements.txt
          sudo umount root
      - name: Upload boot report
        uses: actions/upload-artifact@v4
        with:
          name: rv2-boot-requirements
          path: boot-requirements.txt
          retention-days: 7
