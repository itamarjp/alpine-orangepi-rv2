name: Inspect vendor kernel image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Install inspection tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full util-linux e2fsprogs
      - name: Download pinned vendor archive
        env:
          ASSET_URL: https://github.com/itamarjp/alpine-orangepi-rv2/releases/download/kernel-6.6.63-ky/Orangepirv2_1.0.0_ubuntu_noble_server_linux6.6.63.7z
          ASSET_SHA256: edc1d18e83e9cb509eb12dbab162555269b8255f64636a33e0ca8fcd33d865af
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o vendor.7z "$ASSET_URL"
          echo "$ASSET_SHA256  vendor.7z" | sha256sum -c -
          mkdir -p unpack
          7z x -ounpack vendor.7z
      - name: Inspect image partitions and kernel assets
        run: |
          set -euo pipefail
          IMG="$(find unpack -type f -name '*.img' -print -quit)"
          test -n "$IMG"
          {
            echo "# Vendor archive inspection. Alpine consumes vmlinuz, dtb, modules and esos.elf, then boots with extlinux."
            echo "## Disk layout"
            file "$IMG"
            fdisk -l "$IMG"
            echo
            echo "## Partition details"
            parted -s "$IMG" unit s print || true
          } | tee disk-layout.txt
          mkdir -p mounted
          LOOP="$(sudo losetup --find --show --partscan --read-only "$IMG")"
          trap 'sudo umount mounted/* 2>/dev/null || true; sudo losetup -d "$LOOP" || true' EXIT
          : > kernel-candidates.txt
          : > boot-configs.txt
          for DEV in "${LOOP}"p*; do
            test -b "$DEV" || continue
            PART="$(basename "$DEV")"
            mkdir -p "mounted/$PART"
            if ! sudo mount -o ro "$DEV" "mounted/$PART"; then
              echo "$DEV could not be mounted" | tee -a disk-layout.txt
              continue
            fi
            {
              echo "### $PART"
              sudo find "mounted/$PART" -type f \( -name '*6.6.63*' -o -name '*.dtb' -o -name 'esos.elf' \) -print | head -200
            } | tee -a kernel-candidates.txt
            sudo find "mounted/$PART" -type f \( -name 'extlinux.conf' -o -name 'uEnv.txt' -o -name 'boot.cmd' -o -name 'boot.scr' \) -print | tee -a boot-configs.txt
            sudo umount "mounted/$PART"
          done
      - name: Upload inspection report
        uses: actions/upload-artifact@v7
        with:
          name: vendor-image-inspection
          path: |
            disk-layout.txt
            kernel-candidates.txt
            boot-configs.txt
          retention-days: 7
